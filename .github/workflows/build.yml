name: ImmortalWrt x86_64 周构建

# 每周自动取 ImmortalWrt 最新 25.12.x 稳定版的 ImageBuilder 重新出镜像，
# 并把「包清单」与「首次启动脚本」注入固件。
#
# 为什么不用 snapshots：2026-11 的 snapshot 目标包与包源 ABI 不一致
# （目标包要 libubox20261103，公开包源只有 libubox20260721），ImageBuilder 直接装不上。
on:
  schedule:
    - cron: '0 19 * * 6' # UTC 周六 19:00 = 北京时间周日 03:00
  workflow_dispatch:
    inputs:
      version:
        description: 指定版本（留空 = 自动取最新 25.12.x）
        required: false
        default: ''
      mihomo:
        description: 内置的 mihomo 内核版本（如 v1.19.34；留空 = 最新稳定版）
        required: false
        default: ''

concurrency:
  group: build-x86-64
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: 检出本仓库（配置与脚本）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 清理磁盘（x86 会生成多个 1.1GB 的镜像）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          df -h /

      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-utils zstd genisoimage xorriso
          qemu-img --version | head -1

      - name: 拉取 ImageBuilder（最新 25.12.x 稳定版）
        env:
          CHANNEL: '25.12'
          OVERRIDE: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${OVERRIDE:-}" ]; then
            VER="$OVERRIDE"
          else
            curl -fsSL -o /tmp/releases.html https://downloads.immortalwrt.org/releases/
            VER=$(grep -oE "${CHANNEL//./\\.}\.[0-9]+/" /tmp/releases.html | tr -d '/' | sort -V | tail -n1)
          fi
          test -n "$VER" || { echo "::error::没找到 ${CHANNEL} 的任何稳定版本"; exit 1; }
          echo "目标版本：$VER"
          BASE="https://downloads.immortalwrt.org/releases/$VER/targets/x86/64"
          curl -fsSL -o /tmp/ib_index.html "$BASE/"
          NAME=$(grep -oE "immortalwrt-imagebuilder-$VER-x86-64\.Linux-x86_64\.tar\.zst" /tmp/ib_index.html | awk 'NR==1{print;exit}')
          test -n "$NAME" || { echo "::error::$VER 没有 ImageBuilder 压缩包"; exit 1; }
          echo "使用：$NAME"
          curl -fSL --retry 5 --retry-delay 5 -o /tmp/ib.tar.zst "$BASE/$NAME"
          command -v zstd >/dev/null || sudo apt-get install -y zstd
          zstd -t /tmp/ib.tar.zst
          mkdir -p ib
          zstd -dc /tmp/ib.tar.zst | tar -x -C ib --strip-components=1
          echo "IB=$PWD/ib" >> "$GITHUB_ENV"
          echo "IB_NAME=$NAME" >> "$GITHUB_ENV"
          echo "IB_VERSION=$VER" >> "$GITHUB_ENV"

      - name: 打上游 bug 兜底补丁
        run: |
          set -euo pipefail
          # openwrt-25.12 / master 的 include/rootfs.mk 里这行：
          #   $(if $(IB),,awk -i inplace ...) ;
          # 在 ImageBuilder（IB=1）下会展开成空命令，生成
          #   if [ -z "y" ]; then  ; sed -i ... ; fi
          # → bash: syntax error near unexpected token `;'
          # 把空命令替换成 ':'（no-op）即可。
          F=ib/include/rootfs.mk
          test -f "$F"
          if grep -q '\$(if \$(IB),,awk' "$F"; then
            sed -i 's/\$(if \$(IB),,awk/$(if $(IB),:,awk/' "$F"
            echo "已应用 rootfs.mk apk+IB 兜底补丁"
          fi
          grep -q '\$(if \$(IB),:,awk' "$F" || { echo "::error::兜底补丁未生效，上游模板可能已变化"; exit 1; }

      - name: 内置 mihomo 内核（OpenClash 的 clash_meta）
        env:
          MIHOMO_INPUT: ${{ github.event.inputs.mihomo }}
        run: |
          set -euo pipefail
          # OpenClash 只认 /etc/openclash/core/clash_meta（见 openclash_core.sh），
          # 内置后配合首次启动脚本里的 core_version=0 关掉它的自动下载。
          # 注意：不要用 `curl ... | grep -m1` 或 `... | head`，pipefail 下会因 SIGPIPE 整步失败
          TAG="${MIHOMO_INPUT:-}"
          if [ -z "$TAG" ]; then
            curl -fsSL -o /tmp/mihomo_release.json https://api.github.com/repos/MetaCubeX/mihomo/releases/latest
            TAG=$(awk -F'"' '/"tag_name"/ {print $4; exit}' /tmp/mihomo_release.json)
          fi
          test -n "$TAG" || { echo "::error::解析 mihomo 版本失败"; exit 1; }
          echo "mihomo 版本：$TAG"
          URL="https://github.com/MetaCubeX/mihomo/releases/download/$TAG/mihomo-linux-amd64-$TAG.gz"
          echo "下载：$URL"
          curl -fSL --retry 5 --retry-delay 5 -o /tmp/mihomo.gz "$URL"
          gzip -t /tmp/mihomo.gz
          gunzip -f /tmp/mihomo.gz
          CORE_DIR=files/etc/openclash/core
          mkdir -p "$CORE_DIR"
          install -m 0755 /tmp/mihomo "$CORE_DIR/clash_meta"
          "$CORE_DIR/clash_meta" -v > /tmp/mihomo_v.txt 2>&1 || { echo "::error::内置内核无法执行"; cat /tmp/mihomo_v.txt; exit 1; }
          CORE_VER=$(awk 'NR==1{print;exit}' /tmp/mihomo_v.txt)
          echo "$CORE_VER"
          echo "MIHOMO_TAG=$TAG" >> "$GITHUB_ENV"
          echo "- mihomo 内核: \`$CORE_VER\` → \`/etc/openclash/core/clash_meta\`" >> "$GITHUB_STEP_SUMMARY"

      - name: 注入 root 密码（来自仓库 Secret）
        env:
          ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          SCRIPT=files/etc/uci-defaults/99-default-script
          chmod 0755 "$SCRIPT"
          if [ -z "${ROOT_PASSWORD:-}" ]; then
            # 没配 Secret 也照常构建，但镜像不带 root 密码（只能 LuCI 空密码登录，SSH 进不去），
            # 这种构建会被标成 prerelease，避免误刷。
            echo "::warning::未设置 Secret ROOT_PASSWORD：本次镜像不写入 root 密码，仅用于验证流水线"
            echo "PASSWORD_STATUS=missing" >> "$GITHUB_ENV"
          else
            sed -i "s|__ROOT_PASSWORD__|${ROOT_PASSWORD}|g" "$SCRIPT"
            grep -q 'passwd root' "$SCRIPT"
            echo "PASSWORD_STATUS=set" >> "$GITHUB_ENV"
          fi

      - name: ImageBuilder 构建
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%d)
          PKG_LIST=$(grep -hvE '^[[:space:]]*(#|$)' packaging/packages.list | tr '\n' ' ')
          echo "包清单：$PKG_LIST"
          cd "$IB"
          set +e
          make image \
            PROFILE=generic \
            PACKAGES="$PKG_LIST" \
            FILES="$GITHUB_WORKSPACE/files" \
            EXTRA_IMAGE_NAME="ai-$STAMP" \
            ROOTFS_PARTSIZE=1024 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::make image 失败（rc=$rc），详见 /tmp/build.log 与 job summary"
            df -h / || true
            exit "$rc"
          fi
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

      - name: 校验 mihomo 已进镜像
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq squashfs-tools
          ROOTFS="$IB/build_dir/target-x86_64_musl/linux-x86_64/root.squashfs"
          test -f "$ROOTFS" || { echo "::error::找不到 root.squashfs"; exit 1; }
          unsquashfs -ll "$ROOTFS" | grep -E 'etc/openclash/core/clash_meta' | tee /tmp/core_line
          test -s /tmp/core_line || { echo "::error::镜像里没有 /etc/openclash/core/clash_meta"; exit 1; }
          {
            echo ""
            echo "### 镜像内内核校验"
            echo '```'
            cat /tmp/core_line
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 失败时输出日志尾巴
        if: failure()
        run: |
          {
            echo "## 构建失败，日志最后 100 行"
            echo '```'
            tail -n 100 /tmp/build.log 2>/dev/null || echo "(没有 /tmp/build.log)"
            echo '```'
            echo '```'
            df -h / || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 收集产物
        run: |
          set -euo pipefail
          mkdir -p out
          SRC="$IB/bin/targets/x86/64"
          cp -v "$SRC"/*.img.gz "$SRC"/*.qcow2 "$SRC"/*.manifest "$SRC"/sha256sums out/ 2>/dev/null || \
            cp -v "$SRC"/*.img.gz "$SRC"/*.manifest out/
          ( cd out && sha256sum ./* > SHA256SUMS.txt )
          ls -lh out

      - name: 写入构建摘要
        run: |
          {
            echo "## ImmortalWrt $IB_VERSION x86/64 $STAMP"
            echo ""
            echo "- ImageBuilder: \`$IB_NAME\`"
            echo "- 包清单: \`packaging/packages.list\`"
            echo "- 首次启动脚本: \`files/etc/uci-defaults/99-default-script\`"
            echo "- mihomo 内核: \`$MIHOMO_TAG\` → /etc/openclash/core/clash_meta"
            echo "- root 密码: $PASSWORD_STATUS（missing = 未配 Secret，别刷）"
            echo ""
            echo "### 产物"
            ls -lh out | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: weekly-${{ env.STAMP }}
          name: ImmortalWrt ${{ env.IB_VERSION }} x86/64 ${{ env.STAMP }}
          body: |
            每周自动构建（ImmortalWrt ${{ env.IB_VERSION }} 稳定版 ImageBuilder）。

            - ImageBuilder: `${{ env.IB_NAME }}`
            - 包清单: `packaging/packages.list`
            - 首次启动脚本: `files/etc/uci-defaults/99-default-script`
            - mihomo 内核: `${{ env.MIHOMO_TAG }}` → `/etc/openclash/core/clash_meta`
            - root 密码: ${{ env.PASSWORD_STATUS }}（missing = 未配 Secret，别刷）
          files: out/*
          fail_on_unmatched_files: true
          prerelease: ${{ env.PASSWORD_STATUS != 'set' }}
